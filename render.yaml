# 시험용 서비스 설계(Render Blueprint). 운영 서비스(naver-rank-checker-claude)는 여기에 없으므로 건드리지 않는다.
# Render → New → Blueprint → 이 저장소를 고르면 아래 서비스가 만들어진다. sync:false 값은 만들 때 직접 입력한다.
services:
  - type: web
    name: naver-rank-checker-test
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: WEB_PASSWORD
        sync: false        # 시험 전용 비밀번호(운영 비밀번호와 다르게)
      - key: GH_TOKEN
        sync: false        # 운영과 같은 GitHub 토큰
      - key: GH_REPO
        value: vion2hw/naver-rank-checker-claude
      - key: GH_BRANCH
        value: data-test   # 시험 기록은 data-test 가지에(운영 기록과 섞이지 않게)
      - key: NAVER_AD_API_KEY
        sync: false
      - key: NAVER_AD_SECRET
        sync: false
      - key: NAVER_AD_CUSTOMER_ID
        sync: false
